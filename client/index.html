<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Wajib: viewport fill penuh + safe area iOS -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="theme-color" content="#1C3D2E" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA — wajib untuk standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kitab App" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>Aplikasi Kitab Islam</title>
    <meta name="description"
      content="Platform belajar kitab klasik Islam secara modern dan terstruktur" />

    <link rel="icon" type="image/png" href="/icons/icon-96.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(e => console.error('SW:', e))
        })
      }
    </script>
  </body>
</html>
